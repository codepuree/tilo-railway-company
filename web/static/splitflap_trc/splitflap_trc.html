<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>TRC Train Indicator</title>
    <link href="splitflap_trc.css" rel="stylesheet"> 
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="splitflap_trc.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- start webserver: python -m http.server 8080 -->
    <div id="main-wrapper">
        <img src="splitflap_trc_2row.svg" id="bg-image" alt="Hintergrund">
        <div id="Dir" class="dir-anchor"></div>
        <div id="Dir_2" class="dir-anchor"></div>
        <div id="Track" class="flap-anchor"></div>
        <div id="Train" class="flap-anchor"></div>
        <div id="TrainNo_1" class="flap-anchor"></div>
        <div id="TrainNo_2" class="flap-anchor"></div>
        <div id="TrainNo_3" class="flap-anchor"></div>
        <div id="TrainNo_4" class="flap-anchor"></div>
        <div id="Destination" class="flap-anchor"></div>
        <div id="Remark" class="flap-anchor"></div>
        <div id="Hour" class="flap-anchor"></div>
        <div id="Minute" class="flap-anchor"></div>
        <div id="Track_2" class="flap-anchor"></div>
        <div id="Train_2" class="flap-anchor"></div>
        <div id="TrainNo_1_2" class="flap-anchor"></div>
        <div id="TrainNo_2_2" class="flap-anchor"></div>
        <div id="TrainNo_3_2" class="flap-anchor"></div>
        <div id="TrainNo_4_2" class="flap-anchor"></div>
        <div id="Destination_2" class="flap-anchor"></div>
        <div id="Remark_2" class="flap-anchor"></div>
        <div id="Hour_2" class="flap-anchor"></div>
        <div id="Minute_2" class="flap-anchor"></div>
    </div>
</body>
</html>
